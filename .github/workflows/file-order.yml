# Does the build depend on the order a disk lists files in? ext4 orders a folder by a hash seeded per disk,
# so two machines give two orders. Builds the same version on the runner's own disk (Ubuntu, as a release is
# built) and on an ext4 disk with a new seed (Debian, as F-Droid builds), and compares.
name: file-order

on:
  push:
    branches: [file-order]

permissions:
  contents: read

env:
  VERSION: 24.22.3
  ARCH: arm64

jobs:
  # Minutes rather than hours: configure alone, on four disks, with and without the patch (without it the
  # generated files must differ, or this check proves nothing)
  configure:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure on four disks
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ninja-build clang xfsprogs
          ndk=$(sed -n 's/^NDK_VERSION=//p' build.sh)
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$ndk" > /dev/null
          # build.sh up to ninja
          mkdir stub gen && printf '#!/bin/sh\nexit 77\n' > stub/ninja && chmod +x stub/ninja
          W=/home/runner/work/node-android/node-android/work
          one() { # <name> <keep|drop the patch>
            rc=0; PATH="$PWD/stub:$PATH" JOBS=1 ./build.sh "$VERSION" "$ARCH" > "gen/$1.log" 2>&1 || rc=$?
            [ "$rc" = 77 ] || { tail -50 "gen/$1.log"; exit 1; }
            s=work/node-v$VERSION-$ARCH; mkdir -p "gen/$1"
            (cd "$s" && find . \( -name '*.ninja' -o -name '*.gypi' -o -name '*.gyp' \) -newer .patched -type f -print0 | sort -z | xargs -0 cp --parents -t "$GITHUB_WORKSPACE/gen/$1")
            (cd "gen/$1" && find . -type f | wc -l)
          }
          for mode in patched unpatched; do
            [ $mode = patched ] || rm patches/24/configure.py-file-order.patch
            for disk in own ext4a ext4b xfs tmpfs; do
              mkdir -p work
              case $disk in
                own) ;;
                ext4?) truncate -s 6G d.img; mkfs.ext4 -q -F -E hash_seed=$(uuidgen) d.img; sudo mount -o loop d.img work ;;
                xfs) truncate -s 6G d.img; mkfs.xfs -q -f d.img; sudo mount -o loop d.img work ;;
                tmpfs) sudo mount -t tmpfs -o size=4G t work ;;
              esac
              sudo chown "$USER" work
              one $mode-$disk
              ls -U "work/node-v$VERSION-$ARCH/deps/icu-small/source/i18n" | head -3 | tr '\n' ' '; echo "($disk)"
              mountpoint -q work && sudo umount work; rm -rf work d.img
            done
          done
      - name: Compare
        run: |
          bad=0
          for d in ext4a ext4b xfs tmpfs; do
            if diff -rq gen/patched-own gen/patched-$d; then echo "patched, $d: same"; else bad=1; diff -r gen/patched-own gen/patched-$d | cut -c1-300 | head -20; fi
            diff -rq gen/unpatched-own gen/unpatched-$d > /dev/null && echo "UNPATCHED, $d: same (no proof from this disk)" || echo "unpatched, $d: differs, as expected"
          done
          exit $bad

  build:
    strategy:
      fail-fast: false
      matrix:
        where: [ubuntu, debian]
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: matrix.where == 'ubuntu'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/lib/node_modules /opt/hostedtoolcache/CodeQL
      - name: As a release is built
        if: matrix.where == 'ubuntu'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang
          ndk=$(sed -n 's/^NDK_VERSION=//p' build.sh)
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$ndk" > /dev/null
          JOBS=$(nproc) ./build.sh "$VERSION" "$ARCH"
      - name: In Debian, on a disk that lists files in another order
        if: matrix.where == 'debian'
        run: |
          ndk=$(sed -n 's/^NDK_VERSION=//p' build.sh)
          truncate -s 30G "$RUNNER_TEMP/disk.img"
          mkfs.ext4 -q -F -E hash_seed=$(uuidgen) "$RUNNER_TEMP/disk.img"
          sudo mkdir /disk && sudo mount -o loop "$RUNNER_TEMP/disk.img" /disk && sudo mkdir /disk/work
          docker run --rm -v "$PWD:/src" -v /disk/work:/home/runner/work/node-android/node-android/work -w /src \
            -e VERSION -e ARCH -e NDK_VERSION="$ndk" debian:trixie bash -euxc '
            apt-get update
            apt-get install -y --no-install-recommends clang ninja-build python3 gpgv curl ca-certificates \
              xz-utils unzip patch make
            release=r$(echo "$NDK_VERSION" | cut -d. -f1)
            curl -fsSL -o /tmp/ndk.zip "https://dl.google.com/android/repository/android-ndk-$release-linux.zip"
            unzip -q /tmp/ndk.zip -d /opt
            grep -q "Pkg.Revision = $NDK_VERSION" /opt/android-ndk-$release/source.properties
            WORK=/home/runner/work/node-android/node-android/work NDK=/opt/android-ndk-$release JOBS=$(nproc) \
              ./build.sh "$VERSION" "$ARCH"
            chmod -R a+rwX /src/out
          '
      - run: tar -xOJf out/*.tar.xz "node-v$VERSION-android-$ARCH/node" | sha256sum
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: node-${{ matrix.where }}
          path: out/*
          if-no-files-found: error

  compare:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      - run: |
          for w in ubuntu debian; do tar -xOJf node-$w/node-v$VERSION-android-$ARCH.tar.xz "node-v$VERSION-android-$ARCH/node" > $w; done
          sha256sum ubuntu debian
          cmp ubuntu debian
